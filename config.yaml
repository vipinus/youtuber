cost_tier: free
pipeline: doc              # original(s1-s9 选题→出片→发布) | doc(P7 d1-d7 整片翻译，现为主产品)
                           # 覆盖：`python -m src.run --pipeline original --case <slug>`
llm:
  provider: gemini          # gemini | fake | claude
  gemini_model: gemini-2.5-flash
  script_provider: gemini
tts:
  provider: edge            # edge | fake
  voice: zh-CN-YunyangNeural
  rate: "+0%"               # 正常语速(用户定)。慢速会让配音溢出时间槽(d7有atempo防撞兜底)
media:
  provider: archive         # archive(archive.org PD影片,动态贴题) | nasa(静图) | fake
subs:
  max_chars: 20            # 字幕单条软上限：句末标点必断、次级标点够长才断、不拦腰断词
youtube:
  provider: youtube        # youtube | fake
  client_secret: secrets/client_secret.json
  token: secrets/token.json
remote:
  provider: ssh            # ssh(真跑 zion GPU) | fake
  host: fabric@zion        # ssh -o BatchMode=yes fabric@zion (key-based, NixOS, RTX 3070 Ti)
  workdir: ~/p7-work       # zion 上的工作目录(脚本+音频+产物)
  whisper_model: medium.en # 样片档(GPU faster-whisper);production 可切 large-v3
  timeout_sec: 1200        # ssh/scp 超时上限;zion 卡死时中止管线而非无限挂起
video:
  resolution: 1080p
  fps: 30
guardrails:
  min_documented_facts: 3
  allowed_licenses: [public-domain, cc0, cc-by, cc-by-sa]
p7:                        # P7 整片翻译管线：d1_source 选片参数(首题材 太空/NASA)
  query: "apollo OR spacecraft OR astronaut OR mars OR moon OR planet OR telescope OR space exploration"
  min_sec: 300              # 5min 下限：太短不算"整片纪录片"
  max_sec: 1800             # 30min 上限：MVP 限时长，控制转录/下载耗时
  max_bytes: 500000000      # ~500MB 单文件上限：整片要清晰但不下单片吃满带宽/磁盘的母版
  collections:               # 首题材=太空：只在 NASA 集合里选，既贴题又产权最干净。
    - nasa                   # 换题材时改这里(可用可信集合见 src/media._ARCHIVE_SEARCH_COLLECTIONS)
  bg_gain: 0.5              # d7_assemble：no_vocals 背景床音量(sidechaincompress duck 前)，0~1
  watermark: assets/watermark_tr.png  # d8_meta：缩略图右上角频道水印(透明底 PNG)
publish:
  auto_upload: true         # 全自动上传 YouTube（用户要求）
  visibility: private       # private | unlisted | public —— 冷启动安全档：自动传成私享草稿，过一眼后改 public 即全自动公开（护栏#3）
paths:
  jobs_root: jobs
  seeds: seeds/cases.yaml
  fallback_image: assets/fallback.jpg
