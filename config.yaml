cost_tier: free
pipeline: doc              # original(s1-s9 选题→出片→发布) | doc(P7 d1-d7 整片翻译，现为主产品)
                           # 覆盖：`python -m src.run --pipeline original --case <slug>`
llm:
  provider: gemini          # gemini | fake | claude
  gemini_model: gemini-2.5-flash
  script_provider: gemini
tts:
  provider: edge            # edge(固定男/女神经音) | fake(离线测) | clone(P7 T17: F5-TTS 声音克隆——按说话人
                             #   原声(demucs vocals.mp3切片)当参考音色跨语种克隆中文旁白，需 zion 上的
                             #   clone-venv/F5-TTS，笔记本没 GPU 装不了，只在 config-zion.yaml 启用；
                             #   见 remote.clone_wrapper/remote.clone_timeout_sec)
  fallback_provider: edge   # clone 模式下单段克隆失败(F5推理出错/参考音频损坏等)时的回退引擎(edge|fake)
  voice: zh-CN-YunyangNeural       # 默认男声旁白；段 gender=="male"/null/缺失都落它(不确定不瞎猜)
  voice_female: zh-CN-XiaoxiaoNeural  # P7 T9 性别匹配配音：段 gender=="female" 时用它(修用户反馈的女声画面配男声)
  rate: "+0%"               # 正常语速(用户定)。慢速会让配音溢出时间槽(d7有atempo防撞兜底)
media:
  provider: archive         # archive(archive.org PD影片,动态贴题) | nasa(静图) | fake
subs:
  max_chars: 20            # 字幕单条软上限：句末标点必断、次级标点够长才断、不拦腰断词
youtube:
  provider: youtube        # youtube | fake
  client_secret: secrets/client_secret.json
  token: secrets/token.json
remote:
  provider: ssh            # ssh(真跑 zion GPU) | fake
  host: fabric@zion        # ssh -o BatchMode=yes fabric@zion (key-based, NixOS, RTX 3070 Ti)
  workdir: ~/p7-work       # zion 上的工作目录(脚本+音频+产物)
  whisper_model: medium.en # 样片档(GPU faster-whisper);production 可切 large-v3
  timeout_sec: 1200        # ssh/scp 超时上限;zion 卡死时中止管线而非无限挂起
video:
  resolution: 1080p
  fps: 30
guardrails:
  min_documented_facts: 3
  allowed_licenses: [public-domain, cc0, cc-by, cc-by-sa]
p7:                        # P7 整片翻译管线：d1_source 选片参数(首题材 太空/NASA)
  query: "apollo OR spacecraft OR astronaut OR mars OR moon OR planet OR telescope OR space exploration"
  min_sec: 300              # 5min 下限：太短不算"整片纪录片"
  max_sec: 28800            # 8h 上限(用户定):长纪录片/整场节目纳入
  max_bytes: 2000000000     # 2GB(笔记本开发档)
  collections:               # 首题材=太空：只在 NASA 集合里选，既贴题又产权最干净。
    - nasa                   # 换题材时改这里(可用可信集合见 src/media._ARCHIVE_SEARCH_COLLECTIONS)
  bg_gain: 0.5              # d7_assemble：背景床音量(sidechaincompress duck 前)，0~1
  bgm: replace              # d7_assemble 背景床来源：replace(默认，免版税) | original(demucs no_vocals)
                             # 为什么：样片首次真实上传，NASA 公有领域片里内嵌了片方外购的商业库背景
                             # 配乐，demucs 去人声后原样保留在 no_vocals 背景床里，触发 4 条 YouTube
                             # Content ID 版权认领(不下架但拦变现)。replace 换成 assets/bgm 下的
                             # CC-BY 免版税曲目，从源头消掉认领风险。
  bgm_dir: assets/bgm       # replace 模式的曲目池目录(须含 bgm.json 清单)；缺失/清单空 → 自动回退
                             # original，只告警不中止 run
  watermark: assets/watermark_tr.png  # d8_meta：缩略图右上角频道水印(透明底 PNG)
  video_watermark: true    # P7 T18：正片全程烧台标水印(右上/右下电视台角标式切换)，
                             # 关掉就不叠加、跟老行为一致；文件缺失/读不到也自动跳过，只告警不中止
  wm_min_sec: 300           # 水印切换间隔下限(5min)
  wm_max_sec: 600           # 水印切换间隔上限(10min)——切换点由 slug 的 crc32 确定性生成(同 slug 重跑不变)
publish:
  auto_upload: true         # 全自动上传 YouTube（用户要求）
  visibility: private       # private | unlisted | public —— 冷启动安全档：自动传成私享草稿，过一眼后改 public 即全自动公开（护栏#3）
  playlist: "太空探索/NASA"  # 上传成功后自动加入的播放列表标题（找不到就新建）；换题材改这里；留空则不入列
archive:                    # P7 T15：d10_archive——发布后把整份 job 搬去 NAS
  dir: "~/nas/Share/youtuber" # 归档根目录(zion 上 NFS 自动挂载 tatara 的写入点)；`~` 会展开成当前用户家目录。
                             # 目录不存在/不可写(如开发笔记本没挂 NFS)→ 只告警+落 status:unreachable，不中止 run
  trim_local: true          # 归档校验(逐文件核对存在+大小)通过后删本地大媒体文件，*.json/*.ass/thumb.jpg 留本地当台账
paths:
  jobs_root: jobs
  seeds: seeds/cases.yaml
  fallback_image: assets/fallback.jpg
  title_font: /usr/share/fonts/opentype/noto/NotoSansCJK-Black.ttc  # s8/d8 缩略图标题字体；zion 上换成 config-zion.yaml 里的路径
