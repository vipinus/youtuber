cost_tier: free
llm:
  provider: gemini          # gemini | fake | claude
  gemini_model: gemini-2.5-flash
  script_provider: gemini
tts:
  provider: edge            # edge | fake
  voice: zh-CN-YunyangNeural
  rate: "-18%"              # 语速放慢(悬疑解说更沉稳；原 -8% 偏快)
media:
  provider: archive         # archive(archive.org PD影片,动态贴题) | nasa(静图) | fake
subs:
  max_chars: 20            # 字幕单条软上限：句末标点必断、次级标点够长才断、不拦腰断词
youtube:
  provider: youtube        # youtube | fake
  client_secret: secrets/client_secret.json
  token: secrets/token.json
video:
  resolution: 1080p
  fps: 30
guardrails:
  min_documented_facts: 3
  allowed_licenses: [public-domain, cc0, cc-by, cc-by-sa]
publish:
  auto_upload: true         # 全自动上传 YouTube（用户要求）
  visibility: private       # private | unlisted | public —— 冷启动安全档：自动传成私享草稿，过一眼后改 public 即全自动公开（护栏#3）
paths:
  jobs_root: jobs
  seeds: seeds/cases.yaml
  fallback_image: assets/fallback.jpg
