cost_tier: free
pipeline: doc
llm:
  provider: ollama
  ollama_host: http://eros:11434
  ollama_model: gemma4:31b-cloud
  gemini_model: gemini-2.5-flash
  script_provider: gemini
tts:
  provider: cosyvoice
  fallback_provider: edge
  voice: zh-CN-YunyangNeural
  voice_female: zh-CN-XiaoxiaoNeural
  rate: +0%
media:
  provider: archive
subs:
  max_chars: 20
youtube:
  provider: youtube
  client_secret: secrets/client_secret.json
  token: secrets/token.json
remote:
  provider: local
  wrapper: ~/gpu-py
  clone_wrapper: ~/clone-py
  cosy_wrapper: ~/cosy-py
  whisper_model: large-v3
  timeout_sec: 5400
  clone_timeout_sec: 7200
video:
  resolution: 1080p
  fps: 30
guardrails:
  min_documented_facts: 3
  allowed_licenses:
  - public-domain
  - cc0
  - cc-by
  - cc-by-sa
p7:
  source: youtube_gov
  ytdlp_bin: ~/ytdlp-venv/bin/yt-dlp
  ytdlp_cookies_browser: firefox
  exclude_meeting: true
  yt_channels:
  - '@NASA'
  - '@NASAJPL'
  - '@NationalParkService'
  - '@USFWS'
  - '@usoceangov'
  - '@NOAAFisheries'
  - '@USGS'
  - '@usairforce'
  - '@USNavy'
  - '@CDC'
  include_identifiers:
  - in-effigy-NPS-documentary
  query: subject:(wildlife OR "national parks" OR nature OR birds OR fisheries OR
    conservation) OR title:(wildlife OR wilderness OR "national park" OR salmon OR
    bird OR refuge OR everglades OR yellowstone)
  min_sec: 300
  max_sec: 7200
  max_bytes: 8000000000
  min_height: 1080
  rows: 60
  shorts:
    enabled: true
    count: 1
    max_sec: 55
    publish: auto
    visibility: public
  collections:
  - prelinger
  - FedFlix
  - usgovfilms
  - us-national-archives
  - publicmovies
  bg_gain: 1.0
  duck_bg: false
  bgm: original
  bgm_dir: assets/bgm
  watermark: assets/watermark_tr.png
  video_watermark: true
  wm_min_sec: 300
  wm_max_sec: 600
  encoder: nvenc
  bookend:
    enabled: true
    intro_sec: 3
    outro_sec: 6
    channel_name: 发现纪录片
    thanks: 感谢观看
    like_label: 点赞
    sub_label: 订阅
    notify_label: 打开提醒
    tail: 每期解锁一部 NASA 中文配音纪录片
    logo: assets/avatar_zh.png
    bgm: Morning.mp3
publish:
  auto_upload: true
  visibility: private
  playlist: 纪实精选
bilibili:
  enabled: true
  biliup_bin: ~/bili-venv/bin/biliup
  cookie_dir: ~/youtuber-secrets
  tid: 201
  only_self: true
  line: ''
  submit: app
youtube_en:
  enabled: true
  token: secrets/token_en.json
  client_secret: secrets/client_secret_en.json
  replace_bgm: false
  visibility: unlisted
  playlist: Featured Archive
archive:
  dir: ~/nas/Share/youtuber
  trim_local: true
paths:
  registry: ~/nas/Share/youtuber/published.json
  jobs_root: jobs
  seeds: seeds/cases.yaml
  fallback_image: assets/fallback.jpg
  title_font: /home/fabric/.local/share/fonts/NotoSansCJK-Black.ttc
  title_font_bold: /home/fabric/.local/share/fonts/NotoSansCJK-Bold.ttc
  emoji_font: /nix/store/phyz79jvvpqmhwyx5cryjkx31kpw77n3-noto-fonts-color-emoji-2.051/share/fonts/noto/NotoColorEmoji.ttf
